name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -B -m unittest discover -s tests -v
      - run: node tests/test_frontend.mjs
      - run: python -B skills/vehicle-sales-opportunity/scripts/build_dashboard.py --input skills/vehicle-sales-opportunity/assets/demo.json --output out/ci-demo
